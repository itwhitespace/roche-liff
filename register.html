<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนสมาชิก - Roche</title>
  <!-- Google Fonts: Inter & Sarabun for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #0055ff;      /* Roche Blue */
      --primary-hover: #0040c7;
      --bg-color: #f5f7fb;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #e2e8f0;
      --error-color: #e53e3e;
      --success-color: #38a169;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --font-family: 'Sarabun', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .register-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeIn 0.6s ease-out;
    }

    /* Header Design */
    .header-banner {
      background: linear-gradient(135deg, #0055ff 0%, #003399 100%);
      padding: 30px 24px;
      color: #ffffff;
      text-align: center;
      position: relative;
    }

    .header-banner h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header-banner p {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 300;
    }

    /* Form Content */
    .form-wrapper {
      padding: 24px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary-color);
      margin: 20px 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #edf2f7;
      display: flex;
      align-items: center;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background-color: var(--primary-color);
      margin-right: 8px;
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group.required label::after {
      content: " *";
      color: var(--error-color);
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #4a5568;
    }

    /* Inputs & Select styling */
    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-family: var(--font-family);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background-color: #fcfdfd;
      transition: all 0.25s ease;
      color: var(--text-main);
      outline: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 85, 255, 0.15);
      background-color: #ffffff;
    }

    /* Radio button options styling */
    .radio-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #fcfdfd;
    }

    .radio-option:hover {
      background-color: #f7fafc;
    }

    .radio-option input[type="radio"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .radio-option span {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }

    .radio-option.selected {
      border-color: var(--primary-color);
      background-color: rgba(0, 85, 255, 0.03);
    }

    /* Checkbox Legal styling */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }

    .checkbox-option {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }

    .checkbox-option input[type="checkbox"] {
      margin-right: 10px;
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-option span {
      font-size: 13px;
      color: #4a5568;
      line-height: 1.4;
    }

    /* Submit Button styling */
    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 85, 255, 0.2);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 12px -1px rgba(0, 85, 255, 0.3);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      background-color: #cbd5e0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loader Spin inside button */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    /* Error alert UI */
    .alert-error {
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      color: var(--error-color);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.4s ease-in-out;
    }

    /* Success Card View */
    .success-card {
      padding: 40px 24px;
      text-align: center;
      display: none;
      animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .success-icon-wrapper {
      width: 72px;
      height: 72px;
      background-color: #e6fffa;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      border: 3px solid #b2f5ea;
    }

    .success-icon {
      font-size: 36px;
      color: var(--success-color);
      font-weight: bold;
    }

    .success-card h2 {
      color: #2d3748;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .success-card p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 10px 5px;
      }
      .register-container {
        border-radius: 12px;
      }
      .header-banner {
        padding: 24px 16px;
      }
      .form-wrapper {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <!-- Header -->
    <div class="header-banner">
      <h1>ลงทะเบียนสมาชิก</h1>
      <p>กรุณากรอกข้อมูลส่วนตัวของท่านเพื่อเสร็จสิ้นการสมัครสมาชิก</p>
    </div>

    <!-- Alert Box for validation/submission errors -->
    <div class="form-wrapper">
      <div id="alertBox" class="alert-error">
        <span>⚠️</span>
        <span id="alertMsg">กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน</span>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" onsubmit="submitForm(event)">
        <!-- Hidden User ID -->
        <input type="hidden" id="userId" name="userId" value="">

        <!-- Personal Info -->
        <div class="section-title">ข้อมูลส่วนตัว</div>
        
        <div class="form-group required">
          <label for="firstName">ชื่อ (ภาษาไทย)</label>
          <input type="text" id="firstName" name="firstName" placeholder="ตัวอย่าง: สมชาย" required>
        </div>

        <div class="form-group required">
          <label for="lastName">นามสกุล (ภาษาไทย)</label>
          <input type="text" id="lastName" name="lastName" placeholder="ตัวอย่าง: ใจดี" required>
        </div>

        <!-- Contact Info -->
        <div class="section-title">ข้อมูลติดต่อ</div>

        <div class="form-group">
          <label for="phone">หมายเลขโทรศัพท์</label>
          <input type="text" id="phone" name="phone" placeholder="ตัวอย่าง: 0812345678" maxlength="10">
        </div>

        <div class="form-group required">
          <label for="email">อีเมล</label>
          <input type="email" id="email" name="email" placeholder="ตัวอย่าง: somchai.j@example.com" required>
        </div>

        <!-- Professional Info -->
        <div class="section-title">ข้อมูลอาชีพ</div>

        <div class="form-group required">
          <label>อาชีพ (เลือกได้ 1 ข้อ)</label>
          <div class="radio-group-vertical">
            <label class="radio-option" onclick="selectRadio(this)">
              <input type="radio" name="occupation" value="Doctor / แพทย์" required>
              <span>Doctor / แพทย์</span>
            </label>
            <label class="radio-option" onclick="selectRadio(this)">
              <input type="radio" name="occupation" value="Nurse / พยาบาล">
              <span>Nurse / พยาบาล</span>
            </label>
            <label class="radio-option" onclick="selectRadio(this)">
              <input type="radio" name="occupation" value="Pharmacist / เภสัชกร">
              <span>Pharmacist / เภสัชกร</span>
            </label>
            <label class="radio-option" onclick="selectRadio(this)">
              <input type="radio" name="occupation" value="Hospital/Clinic Officer / เจ้าหน้าที่โรงพยาบาล/คลินิค">
              <span>Hospital/Clinic Officer / เจ้าหน้าที่โรงพยาบาล/คลินิค</span>
            </label>
            <label class="radio-option" onclick="selectRadio(this)">
              <input type="radio" name="occupation" value="Other / อื่นๆ">
              <span>Other / อื่นๆ</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="specialty">ความเชี่ยวชาญ</label>
          <select id="specialty" name="specialty">
            <option value="">-- เลือกความเชี่ยวชาญ (หากมี) --</option>
            <option value="Anesthesiology">Anesthesiology</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Endocrinology / Diabetes and Metabolism">Endocrinology / Diabetes and Metabolism</option>
          </select>
        </div>

        <div class="form-group">
          <label for="organization">ชื่อองค์กร/สถานที่ทำงาน</label>
          <input type="text" id="organization" name="organization" placeholder="ตัวอย่าง: โรงพยาบาลรัฐบาล">
        </div>

        <!-- Legal Agreement Checkboxes -->
        <div class="section-title">ข้อมูลด้านกฎหมาย</div>
        
        <div class="checkbox-group">
          <label class="checkbox-option">
            <input type="checkbox" id="consentPolicy" name="consentPolicy" required>
            <span>ฉันตกลงตามข้อกำหนดของนโยบายโรช *</span>
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="consentProcessing" name="consentProcessing" required>
            <span>ฉันยินยอมให้โรชและบริษัทในเครือประมวลผลข้อมูลส่วนบุคคล *</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">ยืนยันข้อมูล</span>
        </button>
      </form>

      <!-- Success card after registry -->
      <div id="successCard" class="success-card">
        <div class="success-icon-wrapper">
          <span class="success-icon">✓</span>
        </div>
        <h2>ลงทะเบียนสำเร็จ</h2>
        <p>ขอบคุณสำหรับการลงทะเบียนข้อมูลของคุณเข้าระบบเรียบร้อยแล้ว</p>
      </div>
    </div>
  </div>

  <script>
    // --- Database Config Section (กรอกข้อมูลการเชื่อมต่อที่นี่) ---
    const DATABASE_URL = "knkcassjktpolmpdfqfb";       // ตัวอย่าง: "https://xxxxxx.supabase.co"
    const DATABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtua2Nhc3Nqa3Rwb2xtcGRmcWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjQxMDAsImV4cCI6MjA5Nzg0MDEwMH0.SGUaY4AiCV70Wj4UdxZP3pf7RHFT-E1HBGFPXFkCLvg";  // ตัวอย่าง: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    // ดึงค่า userId จาก URL Parameter เมื่อโหลดหน้าจอ
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userIdVal = urlParams.get("userId");
      
      const alertBox = document.getElementById("alertBox");
      const alertMsg = document.getElementById("alertMsg");
      const submitBtn = document.getElementById("submitBtn");

      if (userIdVal) {
        document.getElementById("userId").value = userIdVal;
      } else {
        alertBox.style.display = "flex";
        alertMsg.innerText = "ไม่พบรหัสผู้ใช้งาน (userId) จาก LINE กรุณาเข้าผ่านระบบ LINE LIFF";
        submitBtn.disabled = true;
      }
    });

    // ตกแต่ง UI สำหรับการเลือก Radio Option แบบการคลิก Card
    function selectRadio(element) {
      // ลบ class selected จากตัวอื่นๆ ในกลุ่มเดียวกัน
      const group = element.closest('.radio-group-vertical');
      group.querySelectorAll('.radio-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      // เพิ่ม class selected ที่ตัวที่ถูกคลิก
      element.classList.add('selected');
      // ติ๊ก radio input ภายใน
      const input = element.querySelector('input[type="radio"]');
      if (input) {
        input.checked = true;
      }
    }

    // ฟังก์ชันส่งข้อมูลไปยัง Database เพื่อทำการ Update (PATCH)
    async function submitForm(event) {
      event.preventDefault();

      const alertBox = document.getElementById("alertBox");
      const alertMsg = document.getElementById("alertMsg");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");
      const registerForm = document.getElementById("registerForm");
      const successCard = document.getElementById("successCard");

      // ซ่อนกล่องแจ้งเตือนก่อนหน้านี้
      alertBox.style.display = "none";

      const userId = document.getElementById("userId").value;
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      
      // หาค่า radio
      const occupationElement = document.querySelector('input[name="occupation"]:checked');
      const occupation = occupationElement ? occupationElement.value : "";
      
      const specialty = document.getElementById("specialty").value;
      const organization = document.getElementById("organization").value.trim();
      
      const consentPolicy = document.getElementById("consentPolicy").checked;
      const consentProcessing = document.getElementById("consentProcessing").checked;

      // ตรวจสอบข้อมูลจำเป็นเบื้องต้น
      if (!userId) {
        alertBox.style.display = "flex";
        alertMsg.innerText = "ไม่พบรหัสผู้ใช้งาน (userId) ไม่สามารถบันทึกข้อมูลได้";
        return;
      }

      if (!firstName || !lastName || !email || !occupation || !consentPolicy || !consentProcessing) {
        alertBox.style.display = "flex";
        alertMsg.innerText = "กรุณากรอกข้อมูลและยอมรับเงื่อนไขที่จำเป็นทั้งหมด";
        return;
      }

      // แสดงสถานะกำลังบันทึกข้อมูล
      submitBtn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.innerText = "กำลังบันทึกข้อมูล...";

      // Payload สำหรับแก้ไขแถวเดิมในตาราง members ที่ตรงกับ user_id
      const payload = {
        first_name: firstName,
        last_name: lastName,
        phone: phone,
        email: email,
        occupation: occupation,
        specialty: specialty,
        organization: organization,
        consent_policy: consentPolicy,
        consent_processing: consentProcessing,
        status: "Confirmed",
        updated_at: new Date().toISOString()
      };

      try {
        if (!DATABASE_URL || !DATABASE_ANON_KEY) {
          throw new Error("กรุณาตั้งค่า Database URL และ Anon Key ที่ตัวโค้ดก่อนเริ่มใช้งาน");
        }

        // รองรับทั้งแบบระบุเฉพาะ Project ID และระบุ URL เต็มรูปแบบ
        let finalUrl = DATABASE_URL;
        if (!DATABASE_URL.startsWith("http://") && !DATABASE_URL.startsWith("https://")) {
          finalUrl = `https://${DATABASE_URL}.supabase.co`;
        }
        const cleanBaseUrl = finalUrl.replace(/\/$/, "");
        // ใช้ PATCH ค้นหาเงื่อนไข user_id เท่ากับค่าที่เราส่งมา (?user_id=eq.xxxx)
        const databaseEndpoint = `${cleanBaseUrl}/rest/v1/members?user_id=eq.${encodeURIComponent(userId)}`;

        const response = await fetch(databaseEndpoint, {
          method: "PATCH",
          headers: {
            "apikey": DATABASE_ANON_KEY,
            "Authorization": `Bearer ${DATABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`บันทึกข้อมูลไม่สำเร็จ (Status: ${response.status})`);
        }

        // แสดงกล่องสำเร็จ และซ่อนฟอร์มลงทะเบียน
        registerForm.style.display = "none";
        successCard.style.display = "block";
        document.querySelector(".header-banner p").innerText = "ลงทะเบียนเสร็จเรียบร้อย ขอขอบพระคุณสำหรับข้อมูล";

      } catch (error) {
        console.error("Error updating member:", error);
        alertBox.style.display = "flex";
        alertMsg.innerText = `เกิดข้อผิดพลาด: ${error.message}`;
        
        // กู้คืนปุ่มส่งข้อมูลให้คลิกใหม่ได้
        submitBtn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.innerText = "ยืนยันข้อมูล";
      }
    }
  </script>
</body>
</html>
