<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please wait...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* ปรับแต่งหน้าตา Loading */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    /* CSS สำหรับวงกลมหมุน (Spinner) */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0055ff;
      /* สีน้ำเงินสไตล์ Roche */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .status-text {
      color: #555;
      font-size: 16px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="loader"></div>
    <div id="status" class="status-text">Starting system...</div>
  </div>

  <script>
    // --- Database Config Section (กรอกข้อมูลการเชื่อมต่อที่นี่) ---
    const DATABASE_URL = "knkcassjktpolmpdfqfb";       // ตัวอย่าง: "https://xxxxxx.supabase.co"
    const DATABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtua2Nhc3Nqa3Rwb2xtcGRmcWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjQxMDAsImV4cCI6MjA5Nzg0MDEwMH0.SGUaY4AiCV70Wj4UdxZP3pf7RHFT-E1HBGFPXFkCLvg";  // ตัวอย่าง: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    const statusEl = document.getElementById("status");

    function updateStatus(msg) {
      statusEl.innerText = msg;
    }

    async function main() {
      console.log("=== START LIFF ===");
      updateStatus("Preparing your request...");

      // 1. จัดการ Parameter (รองรับระบบ Redirect Link เดิม)
      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has(name)) return urlParams.get(name);
        if (urlParams.has("liff.state")) {
          const state = decodeURIComponent(urlParams.get("liff.state"));
          const stateParams = new URLSearchParams(state.indexOf('?') !== -1 ? state.split('?')[1] : state);
          if (stateParams.has(name)) return stateParams.get(name);
        }
        return null;
      }

      let contentId = getQueryParam("content_id") || localStorage.getItem("contentId") || "unknown";
      let target = getQueryParam("target") || localStorage.getItem("target") || "";
      let evensource = getQueryParam("evensource") || localStorage.getItem("evensource") || "";
      let evenDA = getQueryParam("evenDA") || localStorage.getItem("evenDA") || "";
      let campaignName = getQueryParam("CampaignName") || localStorage.getItem("campaignName") || "";

      // เก็บค่าเข้า localStorage กันหายระหว่าง Login
      if (contentId !== "unknown") localStorage.setItem("contentId", contentId);
      if (target !== "") localStorage.setItem("target", target);
      if (evensource !== "") localStorage.setItem("evensource", evensource);
      if (evenDA !== "") localStorage.setItem("evenDA", evenDA);
      if (campaignName !== "") localStorage.setItem("campaignName", campaignName);

      // เตรียม URL ปลายทางกรณีเป็น Tracking Link
      let finalUrl = "";
      if (target) {
        if (target.startsWith("http://") || target.startsWith("https://")) {
          finalUrl = target;
        } else if (target.startsWith("www.")) {
          finalUrl = "https://" + target;
        } else {
          const base = "https://www.roche.co.th/";
          finalUrl = base + target.replace(/^\/+/, "");
        }
      }

      // LIFF Initialization
      try {
        updateStatus("Connecting...");
        await liff.init({ liffId: "2010492367-Ad3wEuzW" });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        updateStatus("Authenticating...");
        const profile = await liff.getProfile();
        const userId = profile.userId;
        const name = profile.displayName;
        const pictureUrl = profile.pictureUrl || "";

        // เตรียมข้อมูลปลายทาง
        const currentDir = window.location.href.split('?')[0].split('/').slice(0, -1).join('/');
        const isTracking = target !== "";
        const redirectUrl = isTracking ? finalUrl : `${currentDir}/register.html?userId=${encodeURIComponent(userId)}`;

        // ส่งข้อมูลไป Database
        updateStatus("Loading...");

        try {
          if (DATABASE_URL && DATABASE_ANON_KEY) {
            let finalUrlDatabase = DATABASE_URL;
            if (!DATABASE_URL.startsWith("http://") && !DATABASE_URL.startsWith("https://")) {
              finalUrlDatabase = `https://${DATABASE_URL}.supabase.co`;
            }
            const cleanBaseUrl = finalUrlDatabase.replace(/\/$/, "");

            const sendPost = (endpoint, payloadData) => {
              return Promise.race([
                fetch(endpoint, {
                  method: "POST",
                  headers: {
                    "apikey": DATABASE_ANON_KEY,
                    "Authorization": `Bearer ${DATABASE_ANON_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                  },
                  body: JSON.stringify(payloadData),
                  keepalive: true
                }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 2000))
              ]);
            };

            // 1. บันทึกข้อมูลสมาชิกแบบ Pending Register เสมอ (หากยังไม่มีในระบบ)
            try {
              const memberPayload = {
                user_id: userId,
                display_name: name,
                picture_url: pictureUrl,
                status: "Pending Register"
              };
              await sendPost(`${cleanBaseUrl}/rest/v1/members`, memberPayload);
            } catch (memberErr) {
              console.log("Database members insert finished or failed (Normal if user already exists):", memberErr);
            }

            // 2. หากเป็น Tracking Link ให้บันทึก liff_logs ด้วย
            if (isTracking) {
              try {
                const logPayload = {
                  user_id: userId,
                  display_name: name,
                  picture_url: pictureUrl,
                  content_id: contentId,
                  target: target,
                  full_url: finalUrl,
                  even_source: evensource,
                  even_da: evenDA,
                  campaign_name: campaignName
                };
                await sendPost(`${cleanBaseUrl}/rest/v1/liff_logs`, logPayload);

                // บันทึกสำเร็จ ให้ล้าง localStorage ของระบบ Redirect Link
                localStorage.removeItem("target");
                localStorage.removeItem("contentId");
                localStorage.removeItem("evensource");
                localStorage.removeItem("evenDA");
                localStorage.removeItem("campaignName");
              } catch (logErr) {
                console.error("Database liff_logs insert failed:", logErr);
              }
            }
          } else {
            console.warn("Database configuration is incomplete. Skipping database logging.");
          }
        } catch (e) {
          console.log("Database Request finished or timed out:", e);
        }

        // Redirect
        updateStatus(isTracking ? "Redirecting to destination..." : "Redirecting to registration form...");
        setTimeout(() => {
          window.location.replace(redirectUrl);
        }, 200);

      } catch (err) {
        console.error("Error:", err);
        updateStatus("Authentication failed. Please try again.");
      }
    }

    main();
  </script>
</body>

</html>
